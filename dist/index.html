<!doctype html><html lang="zh-CN" data-season="winter"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6eaf3"><meta name="description" content="中子流水账"><meta property="og:title" content="中子流水账"><meta property="og:description" content="中子流水账"><meta property="og:type" content="website"><title>中子流水账</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><script>try{const s=localStorage.getItem('journal-season');if(s==='summer'||s==='winter')document.documentElement.dataset.season=s;}catch{}</script><link rel="stylesheet" href="assets/style.css"><script src="assets/app.js" defer></script></head><body><a class="skip" href="#main">跳到正文</a><header class="wrap"><h1><a class="brand" href="index.html">中子流水账</a></h1><nav aria-label="主导航"><button class="season" type="button" aria-label="切换到夏季墨绿色" title="切换到夏季墨绿色">☀️</button></nav></header><main id="main" class="wrap"><section class="archive" id="journals" aria-label="全部游记"><div class="tools"><span id="result-count" role="status" aria-live="polite">10 篇游记</span><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="journal-search" type="search" placeholder="搜索游记" aria-label="搜索游记全文"></label></div><div class="grid"><article class="card" data-search="秋季的台北，夏季的台南 台北 · 台南 · 高雄 taiwan 又见台北，不同的季节，不同的温度。

第一天早上，晴空万里，二十五六度的气温很难说这是秋季。日式又中式的老城区，上次没来得及看的，这次走了一整天。但细细想想，又想不起来有什么。骑楼一座座，穿插着众多颜色极其鲜艳的寺庙，前来朝拜的人也络绎不绝。小店一间连着一间，五点半就开始营业的早餐店，汇集了大陆各个省份的名称，山东王记豆浆店，福建陈记早餐店，潮汕鳗鱼意粉。没有名字的水果摊，没有名字的理发店，转进一条小巷，好像老家的县城集市，各种食物各种蔬菜，排着大长队买午饭，摩托车穿梭其间，但又极其礼让行人，不像香港。热情的老板，热闹的人们。公车上，普通话的报站，让人感觉好熟悉——但那一些台湾腔，和闽南话客家话，还有博物馆里关于抗美援朝完全不同的叙事，又让我感觉，我在台湾。台北的天气总是很多变，就像这座城市，新与旧，山与盆地，高与低。在微雨中，坐着台湾高铁南下。

即使在台湾，南北差异也好大，食物的味道，人们说的语言，贫富差距的感觉。台南，一下台铁就遇到好多流浪汉，万圣节氛围毫无，只有真的很奇怪的人在不太晚的晚上游荡。第一印象并不太好，但台南回味无穷，一座城市，没有很高的建筑，给人的感觉也没有强烈而突出的感觉，但多元而有趣。比如在热兰遮博物馆，记录荷兰东印度公司在台南的历史，里面提到的郑成功，不是台北的台湾国家博物馆那样民族英雄的叙事，而是用原住民的视角去说荷兰和郑成功，并称后者为海盗。万圣节当天台南好像什么都没有，但第二天晚上住的地方旁边正好有蓝营的候选人选举拉票演讲。听了一小会，好像什么核心都没有，但氛围很到位，以及一些可疑的依附主义：拉着众多老年人来助阵的大巴车，在下面坐着的都主要是老年人，当然没有看到什么发盒饭发鸡蛋等事。但相比安静的万圣节，这一晚上分外热闹。

台南的食物很美味！虱目鱼肚汤，鲜美的鱼皮还银光闪闪，肥美的鱼肉只需要加一点点盐和糖就无比美味。切的及其薄的牛肉，用水一烫烫熟，好美味！还有各种美味的水果：红心软糯芭乐，白心爽脆的芭乐，酸甜的菠萝，奇异的百香果……要走的那个早上，更是六点起床（也是睡不着），一口气从七点到八点半吃了三顿早餐，再喝一碗虱目鱼粥，吃又咸又甜的素粽，扎实的碗粿。

为了赶车，一路小跑着跑去了台南车站，却发现买的台铁上了express快线，看来做事不要着急，不过着急做错了也没关系，补回来就好了，车也往前开并顺利到达了高雄。再喝最后一杯红茶鲜奶茶，随便漫步在中央公园，这座有点城市有点县城，楼有点高但又很疏松的地方停留片刻，便又回到了香港。"><a href="journals/taiwan-autumn.html"><div class="card-image"><img src="assets/taiwan-autumn/04.webp" alt="秋季的台北，夏季的台南的照片" loading="lazy" decoding="async"></div><h2>秋季的台北，夏季的台南</h2></a></article><article class="card" data-search="台北流水账 台北 · 七星山 taipei 12月，台北小雨。在湿润清新的空气里，迎来了在台北的第一个早晨。

干净的街道，葱葱的山丘，来往的人没有香港那样的匆忙，或者是北方原子人的疏离感，最先感受到的是台北人的热情和外向。机场穿着亮黄色工作服的大妈，虽然值着夜班，但没有什么抱怨，和来往的游客不时打打招呼，随机闲聊几句；卖葱油饼的老板，老家在内蒙古和北京，从大陆北方来台湾七八年，虽然没有问，但我感觉他应该是喜欢台北的。爬山时，1940年出生的每周都来爬山的两个老夫老妻，见到来旅游的我们，颇为自豪地开始自我介绍，问我们在台湾玩几天，什么时候来，什么时候走。虽然只在台湾玩两天，花了一整天，爬了台北最高峰，1120m的七星山主峰。但真是不虚此爬！和香港的山大为不同！海拔更高，纵向上植被的变换就更为精彩——山脚下还是郁郁葱葱的亚热带森林，天气晴朗，鸟语花香，难以想象已经是12月；山顶则是大片包箨矢竹和白背芒，体感温度低于10度，大雾大风下，发出骇人的阵阵狂响；翻过顶峰，又别有另一番趣味，火山活动很活跃的台湾，大大小小的小油坑，往外喷着臭鸡蛋味的硫气，寒风夹杂着滚滚热气，一流温泉从一个个深黑的小洞里流出来，蜿蜒旋转，辉映着台北冬季的风和落日。

坐着差点就错过的1717号公车（google map上的预报颇为不准，写着还有10分钟才到的车，其实已经来了，下一班就要一小时之后，真是好险！），橙红色的落日在山后时显时隐，周日已经降温到13、14度，但没有什么strangers in taipei的感觉，只是觉着安心又温馨。

山脚下的竹林，簌簌地响着，在南山诗社浅学的曲子《定风波》就自然地唱了出来：莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。料峭春风吹酒醒，微冷，山头斜照却相迎。回首向来萧瑟处，归去，也无风雨也无晴。真是无比契合这一天的行山！真喜欢苏轼！对世界的认知、对人生的体悟，是非常不同于西方的东方大智慧。周六的台北故宫，让我又看到了苏轼真迹！虽然很多苏轼的作品在2020年北京故宫交流特展上看过了，比如著名的赤壁赋，但再看时，还是颇为激动。台北故宫真是太丰盛了！不禁感到幸运，略懂中文，也略懂英语，能大概理解中国古代的智慧，也能大概体悟西方很有逻辑的哲学的智慧。但话说回来，除了这两门语言和他们能代表的文化，还有那么多其他的语言和文化，或者说单单中文和英文所能承载的信息，我也只是略知一二，看到能有所体悟，蜻蜓点点水罢了。但没关系，不能因为认知的片面和可能的错误就害怕去学习和思考。这是一个循序渐进的过程，要包容，要反思，不需多余的情绪和偏见，在已有的知识体系上继续探索，抑或是可能某一天所有的体系都要重新建立，都是极好的，永远有新的东西去尝试和思考，这也是人生的意义之一。

城市与自然，新与旧，在台北如此自然而有趣地呈现在我面前。台北101下新城区圣诞气氛浓厚，可惜行程匆匆，没来的急在老城区多走走看看，也没来得及仔细看看中正纪念堂、国父纪念堂，便也没有什么这方面的思考和体悟。

台北，再见！"><a href="journals/taipei.html"><div class="card-image"><img src="assets/taipei/04.webp" alt="台北流水账的照片" loading="lazy" decoding="async"></div><h2>台北流水账</h2></a></article><article class="card" data-search="广州流水账 广州 guangzhou 早上起来退了酒店，看利苑酒家评价不错，打算吃个早茶去。说起来这两天吃了不少早茶，红米肠真是好香，脆和鲜完美地融合了，不过就是感觉自己胖了一大圈！看距离大约三四公里，不算远，便走着去了。路过一天桥时，一母子在乞讨，播放着佛教音乐，儿子看起来病得很重，背部隆起，头颅看起来也不太正常，母亲在给他擦背，没有什么表情。我不敢多看，快步走开，心里却在想，这位母亲会不会想过，我的这个孩子为什么给我带来了这么多苦难，而她又求助于佛法，是否是觉着这些苦难是一种磨砺？

下了天桥原来是广东省肿瘤医院。没有什么欢声笑语，每个人脸上都有着各自的情绪。一个很年轻的女孩蹲在地上，手里拿着ct，她脸上很有肉，化着淡妆，但眼袋有些大，显得没有什么神，当然，没有神也可能来源于别的原因——一种对未来的迷茫、痛恨、无奈，想大声呼喊，但又无可奈何。再走两步，又有一个女子。这是位中年女子，穿着病号服，很瘦，正在大声地向她的亲戚说治疗的事情，一边说一边用力地落泪。再次不敢多看了，速速走离了这片区域。突然想起第一天下午刚到广州，在小北路上路过广州市第十七中学。我觉着建筑很有特色，想走近看看。恰巧是中午，初中生们午休结束，正在回学校。一个看起来像是初一学生的小女孩，扭啊扭啊地跑向前面的一位老师：”张老师~，我今天……“后面却忘记了，但这已经足够，午后暖暖的阳光照着，如此生机盎然而欣喜。人的生死悲欢，就在这同时发生着。

走到了利苑，刚刚十点，不得不吐槽百度地图，越来越难用，广告过多，找不到餐厅的营业时间，而在google map上说十点开始营业。结果上到四楼一问才知道，十一点半才开市。那敢情好，只能作罢！今天的计划本是吃个早茶，溜达着去沙面岛看看。如此看来，上午还可以另去别处看看。于是打算骑个单车去陈家祠看看。广州的老街区街道很窄，没有专门的自行车道。不过广州人早已习惯，灵活地穿梭其间，也很少见北京的那种急躁和路骂。骑着骑着路过了光孝寺，不如就进去拜一下。原来慧能曾在这里的菩提树下受戒。很多男男女女在祈祷，虔诚又充满了欲望。人生的苦难也好，欢愉也好，由谁来渡？人们总要找到一个解。

陈家祠是很美的，原来中国建筑也可以如此繁复而又大气！广州真是有文化又有活力的地方，可能就是因为这样，中原人才叫他们南蛮：一种打不过就开始侮辱的感觉！这两天有感触的地点有很多，越秀公园里渐变的树和湖中的倒影，中山纪念堂里再忆起三民主义——以及感觉一切都要重来，虽然我一切都不甚清晰，石牌村压抑又有活力，勤劳能吃苦的中国人让我对中国经济有一种没有太多根据的信心，而下午去的中国华侨纪念馆也是类似的感受。三天的行程里混入了一些econ的浓度，朝拜了一下暨南iesr，站在楼下读了半小时张同学写的olg with learning的model；见到了很久没见的香樟旧友，感觉朋友进步飞速，让我感触颇深，还是要大胆讲，静心想，真心佩服！

玩得有点太累了，虽然每天并没有什么具体的安排，只是随意走，但还是很累，台湾和新加坡下学期再去玩吧。在火车上大睡了一觉，现在非常有学习的欲望了：一会就计划一下这周要做的事情！"><a href="journals/guangzhou.html"><div class="card-image"><img src="assets/guangzhou/03.webp" alt="广州流水账的照片" loading="lazy" decoding="async"></div><h2>广州流水账</h2></a></article><article class="card" data-search="欧洲旅游很愉快！ 巴黎 · 图恩 · 昂蒂布 · 罗马 europe 最喜欢的城市是巴黎！可能正好赶上在奥运会开幕之前两周来，街道清洗和整治了，而公共交通还没受到管制，所以一切都干净又方便。巴黎的难忘，在于夏天不冷不热的天气，彬彬有礼假装客套而又高傲的parisian，街头永远坐着些喝着一杯咖啡聊天或者工作的悠闲的人，植物园里晨跑的、打太极拳的人，卢浮宫的震撼，还有随便走走就能遇到的名人故居，好吃的各种面包和其他食物，以及，不期而遇地在先贤祠楼顶楼台的牌子上发现，有名的prépa llg就在先贤祠对面的街上，绝佳的位置，好美的小校园，好漂亮的建筑！可惜呆的时间太短，无从更多地了解这个城市，真希望以后还能有机会来！

被震撼的自然风光太多了！最喜欢的大概是thun lake。静谧的湖泊，alps在那静静地立着，云雾缭绕间，雪顶若隐若现。就是瑞士的风光看久了觉着有点审美疲劳了，再加上thun这里夏天都有点冷，物价这么贵，大抵是只适合旅游浅浅看看的地方，not a good place for my retirement：）

我还极其喜欢的城市是antibes，南法的一个小镇。蔚蓝海岸的大海看一眼就难忘，真是清澈见底！有岩石和没岩石处颜色不同，晴天和多云时颜色各异，朝夕颜色也不同，闭上眼，是天空的淡蓝色，蓝宝石一样的深蓝色，绚丽的橙色是晚霞的映照。cap d’antibes 这条徒步路线绝佳！每个转角景色都让人惊叹，希望以后还能在其他季节再走一次！老城也很美，还有毕加索博物馆，在antibes这样的地方，浩瀚的大海和天空，更能体会到“i feel the need to achieve maximum intensity with a minimum of means. this is what led me to give painting an increasingly pared-down character.”这个城市物价也不高，人都更活泼明媚，温度一年四季都很合适，太阳在夏天明媚但不会晒地烫人，去法国大城市也有高铁，适合养老和度假！

最后去了罗马，一方面是因为从这里坐飞机回国有直飞，一方面是我觉着古希腊古罗马爱琴海古埃及古巴比伦之间总要去一个看看，而罗马最合适去。于是浅浅呆了一天，古罗马辉煌而血腥，刚强而脆弱，真是不一样的文明！这个城市太热了！有种回北京之前的过渡感，好在只呆了一天。不过吃的极其便宜又好吃，披萨真是绝了，随便一家都好吃！意大利人个人感觉最豪爽，爱开玩笑，爱大笑，没有什么拿捏着的“装”在里面，很喜欢hhh

十天的旅行就结束了！哦对，法航和国航相比，更喜欢前者，吃得好，管理感觉更好，设备也新，还有法航的安全宣传片绝了！看完还想再看一遍！一下子感受到了巴黎的时尚优雅，灵活，有创意！

嗯，回来开始接着搬砖了:)))"><a href="journals/europe.html"><div class="card-image"><img src="assets/europe/10.webp" alt="欧洲旅游很愉快！的照片" loading="lazy" decoding="async"></div><h2>欧洲旅游很愉快！</h2></a></article><article class="card" data-search="甘肃流水账 兰州 · 敦煌 gansu 这次真是流水账了，和爸妈一起出游，似乎没有什么太强烈的情绪产生。只是有时候和最熟悉的人一起，容易behave的变差，这是不太好的。要感谢别人的帮助，nothing should be taken for granted. 一年里感觉父母老得很快，比去年去欧洲玩的时候，似乎更快的感受到疲惫，唉！

先到了兰州，看黄河似乎有两个维度。滚滚黄河不会因为我混乱的思绪，波动的情绪而变化什么，焦虑紧张担忧喜悦，不必在意别人，也不必想再更长时间里会怎样，不会怎样。但我也定不能从桥上一跃而下，流水的力量可是实在地落在个人身上，体验只有放在自身维度上才会变得鲜活、漫长，不必回避自己的情绪。just enjoy my journey ;)

甘肃省博物馆，体验感奇差无比，人山人海，喘不过气来。著名的展品没有介绍，好几个展览没有冷气，人又非常多。进去匆匆看了看，落荒而逃了。因为23年在国博看了仰韶文化的展览很喜欢，还有感而发了hunter-gatherer和农业文明在文化上的大不同  ，如今在黄河上游仰韶文化的发源地，我只得心烦意乱！又想起前年去泉州玩，感觉那里也很有历史，但博物馆也建的乱七八糟，或许一个是激励问题，地方上没有太大动机去把博物馆修好，再加上可能地方财政吃紧；另一方面可能是国人平均上对美和历史的把握和感知还有不小的进步空间。这点参观鸣沙山月牙泉景区也有同感（还有上个月去的平潭），中国似乎没有美的教育，景区里如果能少一些嘈杂奇怪的音响，多一些和自然融合好又比较好走的trail，似乎会更好，但还是那样，什么发展阶段，什么样的平均审美，这样的景点还是可以的。

敦煌的沙丘很震撼。大漠孤烟，长河落日！微风吹过，瞬时一片黄沙漫天，好大的力量。爬沙丘，七十度的坡，有无穷的力量要把我吸进去似的。好担忧沙漠会吞掉月牙泉，淹没敦煌城。考完macro qe那天，为了放松一下大脑，看了看宫崎骏的风之谷（没错，确实放松，我无处安放的肾上腺素和焦虑，顺着我丝滑而无法停止的眼泪代谢的差不多，心里暖暖的，晚上睡特好！）。真想所有人类都有那样的灵性，能体悟到自然的力量，而不畏惧，与之和谐相处。

为了下午两点开会，决定早上五点半出发去170公里外的国家雅丹地质公园转转。作为一只早起的大笨虫，并没有被鸟吃，反而看到了一个人一辆车都没有的戈壁，还有日出。整个景区似乎只有我们几个人，呜呜风鸣，徒步应该是很好的，可惜时间不够，也没做准备。终于看到了地理题里的雅丹体，从好大一块，变成一个小土丘，北面长着几根草，不必悲伤，这几根草还可以给骆驼吃，生与死的界限在这里似乎是模糊的，平静温柔又有力量。想到莫高窟的涅槃像，人们想尽办法，在佛法中寻求解脱，苦苦修行摆脱六道轮回，获得永生。

超级便宜的羊肉是极好的，人均80就能吃到好鲜美的烤羊排、手抓羊肉、胡羊焖饼、沙葱炒蛋……当然按照当地工资，这个价格是很贵了，就好像赚美元在北京花觉着北京物价低一样hhh

最难忘的是人：激烈的黄河上游水、辽阔的大漠，孕育了热情的兰州人：主动给我们指路的年轻小伙，主动告诉我和妈妈这个“尕”怎么念的老头，叨叨着“尕娃尕娃”晃着走远了。

p.s. (also importantly!) 感谢一条友友的期待，期待我写quasi“travel学术感想”（明明每次写得都完全不学术啊哈哈哈）！着实开心😎可惜这回应该真是流水账了，还请多多包容担待！"><a href="journals/gansu.html"><div class="card-image"><img src="assets/gansu/05.webp" alt="甘肃流水账的照片" loading="lazy" decoding="async"></div><h2>甘肃流水账</h2></a></article><article class="card" data-search="杭州同金华travel流水账 杭州 · 金华 · 东阳 · 义乌 zhejiang 杭州真文明又先进，大家都behave的很好，地铁里的都有好多新鲜玩意，比如一些神奇的好似风扇一样的广告播放仪器，还有智能省电的感应灯。在同学推荐下吃了好好吃的虾爆鳝面，市民中心这家旁边就是知味观，买了点小点心饿了尝尝:)) 难道是北京和香港都是更荒漠的美食荒漠，我感觉杭州菜都好好吃，尤其是鳝鱼！

吃过午饭，晃悠着坐高铁去金华，写这段字的时候我头发上还有着站台上可恶的二手烟的味道。

金华明显差了很多，地铁首先是没开通全国交通联合（后来才知道原因是因为这不是地铁，属于铁路，从金华站一直到东阳），再次是上大家抢上抢下，第一观感！大家都好着很忙碌，开着非常场面的车（或许是生意人的必须品），大声谈着进货事宜。道路平坦，但没有共享单车，却有共享电动车；路边店铺也有非常多卖电动车的，看来金华地区的人不常久坐，或者还没有很强的健身意识。金华地区，看起来轻工业非常发达，但金华地区人均gdp却是浙江倒数第二：可能是既不是舟山这样的港口城市（和石化产业），又没有杭州这样的高新技术，relatively收入就低了些。再加上小企业为了少交税，应该会少报一些产值？

昨天和小古聊天，讲到躺在床上看蓝天固然悠闲，但也有点孤独，小古说，她钟意如此，可以想好多事情。我开始type：这就是i人嘛。然后删了，我想，对啊，我也可以静静多多想想，everything，from why jinhua is not as rich as hangzhou or zhoushan, to how ppl interact with each other, and so many things i want to and need to think about. 于是我说，没错，我也要多多静下心来思考和阅读。人是多变而极其复杂的，无论什么measure都是一种工具和参考而已。不要被条条框框束缚，让自己和思绪自由伸展吧！

晚上一点五十，外面男女在大声争吵，吵了已经快一个小时；有什么事情不能沟通呢。相爱很难，不能想太多。

今日游中国东阳，世界义乌，浙江金华heheh东阳的卢宅好独特，东阳木雕和老建筑和广府见到的又很不一样。但相似的都是一种中式巴洛克繁杂风格的震撼。不过同巴洛克风格也不同：卢宅在繁杂和敦厚简朴之间切换自如，大堂繁杂气派，居室又简约接地气，大中之道！

随后又行咗《东阳中国木雕城》睇下现代东阳木雕，人很少，不过很有趣的是，店里坐着的都是老板娘，一个男的老板都没睇到。然后就来到了世界的义乌，商城里确实很多中东或者非洲地区的人，不过如此蜻蜓点水的看看也看不出啥，中东饭挺好吃的，义乌给人感觉比东阳和金华都繁华是真的，别的也就没有了。义乌是省直管县，而且从1953年开始就是了，行人匆匆，我都睇唔明。

现在呢在地铁上，真是愤恨！所有的家长如果都能懂得如何科学教育孩子就好了！中国人behave的还有很大提升空间。一个妈妈带着两个仔，一个大的上小学的女仔，一个小的看起来上幼稚园的是男仔，妈妈买了一盒冰激凌，给男仔食，并警告女仔不要同弟弟抢。弟弟一把拿过冰激凌，姐姐也想吃，弟弟开始表演哭泣，一脸戾气。妈妈立刻训斥女仔。弟弟一脸得意的开始吃。随后，妈妈又开始矛盾的说，给姐姐分享一点好不好，弟弟又开始哭闹，姐姐呢则直接想“偷走”。他们一家就这样矛盾的，扭曲的吵闹着吃这一个冰激凌。地铁上人来人往，我时常觉着，大家都能变得更幸福，只需要外界推一把。

还有一事，？我先写了上一段，忘了这一事是啥了。。。想起了！是小红书。我这两天又下载了小红书，想着看看旅游攻略啥的。结果没看到什么有用的，反而看了一堆乱七八糟有的没的。怒卸载！还不如wiki上写得好，让我很快掌握了基本情况；也不如知乎网页版的一些帖子，虽然充满了刻板印象，但也是有趣而有帮助我了解金华和浙江的。小红书就像这段开始这句话，时常点开就忘了要干啥，非常糟糕！

终于返回了屋企，感觉金华这样的小县城，有种她独特的安心。明天打算去灵隐寺看看传说中的万元电子请愿，之后就返香港。说到香港，来金华更让我喜欢香港了。金华江虽然宽阔美丽，但太柔了，太平静了。还是喜欢温柔又有力量的吐露港，波澜壮阔又沉静的维多利亚港。"><a href="journals/zhejiang.html"><div class="card-image"><img src="assets/zhejiang/01.webp" alt="杭州同金华travel流水账的照片" loading="lazy" decoding="async"></div><h2>杭州同金华travel流水账</h2></a></article><article class="card" data-search="北上南昌避避风 南昌 nanchang 突然有些悲伤，也许是没事找事，但感觉最近自己失去了情绪高涨的能力：听到inspiring的观点虽然欣喜，但不会像以前一样激动地叽叽喳喳；看到有趣的人自然想了解一下，但也没太多力气。虽然在练习跑步，轻轻松松可以半小时五千米，但感觉除了变瘦，对精神上没有太大帮助。我将这种情况归结于咖啡因摄入大幅下降的原因，这两个月从一天两三杯下降到一天两三口。记忆里好似确实下降了，睡眠时间也变长了。不知道过段时间等我的腺苷受体变少了，会不会好起来。朋友让我去再测测mbti哈哈哈，说我变得像个小小冰柜！获得了足足的emotional stability，是我曾经无比憧憬的。如今看来真糟糕，不希望我变得麻木而不敏感。不过也不要患得患失，什么样子都是一种体验。

要来台风，索性北上两三天，正好探索一个新城市。就南昌吧！来到盛产著名经济学家的江西，不知道是不是和南美盛产经济学家一个原理。下了火车，晴天，想着看看市容市貌，在等公交车，已经等了半小时，哎！咋还不来车。罢了，坐地铁去。好了，到了地铁站，那个公交车也发车了。可是谁能对这种事情做出准确的预测呢。在我撤退的时候，选公交的value已经小于选地铁了。

一天过去了，很开心，除了工作效率有点低下，不过来都来了，应该多花一点时间探索一下这个城市。一切都很新鲜！晨跑2.8km去吃早饭，凉爽的风夹杂着细细的秋雨，碧绿的湖水，热闹的人民公园，好不舒服！如此看来练习跑步是极好的，扩大了我交通方式的choice set，我的福利提高了。

我住在东湖区的老区，周围县城感很强：到处是乡镇企业兴盛时期的建筑，可见没有什么新楼取代他们。吃的好便宜，三块五的拌粉，十几块的水煮，哦，还有盒马美味的五十块两只的小闸蟹;) 不过碳水过多，吃完早饭就开始晕碳了。江西省博物馆strongly dominates 甘肃省博，从仙人洞最早的农耕文明，到西汉海昏侯（没去这个博物馆，但当年在首都博物馆看了！），再到成为航运中心，翰林多吉水，朝士半江西。不过博物馆没有介绍江西衰落的历史，令人遗憾！

后面懒了，不想写了。但是我认为滕王阁值得一提。去这几天都阴雨连绵的，唯有去滕王阁那会，天晴朗了，如此宽阔而平静的赣江，又有大桥横跨东西，西岸的新曲高楼林立，东岸的老区也颇有特色。我本以为，阴雨连绵地登上滕王阁，多少会留下一点眼泪来，可巧如此阳光明媚！想起打壁球时同学所言，人只活这一次，多多学习人类知识是一件很有意义的事情，努力理解世界运行的方式也是很有意思的事情。至于能不能做出点marginal的contribution，我想这是一件自然的事情。

去之前好几个同学向我大夸特夸南昌好吃，我认为这个也有必要再说一句:))总体而言，南昌食物味道比较浓，很有特色，不虚此行！不过，还是广州菜和淮扬菜更符合我胃口，南昌整体上碳水太多了 ;) 是不是所有港口城市都比较重碳水呢？虽然武汉上海是这样，但广州又不是这样。于是我和广州朋友得出一个荒谬的结论：广州人干活懂得省力，俗称会偷懒。当然，这显然是一个错误的结论！"><a href="journals/nanchang.html"><div class="card-image"><img src="assets/nanchang/04.webp" alt="北上南昌避避风的照片" loading="lazy" decoding="async"></div><h2>北上南昌避避风</h2></a></article><article class="card" data-search="福州&amp;平潭流水账 福州 · 平潭 fujian 风慢慢吹。喜欢nt人的果敢、坚毅、清晰，也喜欢nf人的为他人考虑，世界就是因为有各种各样可爱的人们才变得多彩：张院长美丽生动的vlog，陈书记的24小时高强度视察讲话，崔博士一流的驾驶技术和卓越的口技，真开心和聪颖可爱的同伴们一起出游！！！

福州还是适合冬天来，夏天太热了，着实没心静下心来看古迹🥲夏天的福州和记忆里的福州似乎相去甚远：更商业化的三坊七巷，历史久远但没有什么介绍的西禅古寺，但和同伴们一起还是有好多好多好玩的回忆：土笋冻、焦糖鹌鹑蛋，还有花肠。

平潭自然风光是极好的，清澈见底的海，就是在晴天直晒下，也五彩斑斓：透绿的仙人井，碧蓝的68海里，深沉而忧郁的镜沙。不输南法！但可惜，国人还是太缺乏美的教育，我想，用铁绳和细柱子代替仙人井的石头桩围栏，会更美；去掉景区里一直在播放的奇怪bgm和安全提示音，能让大家更好地听听大海的声音。不过啦，这应该也是个过程，什么样的阶段，对应着什么样的审美和设计，这样的景区，应该也是会受到大部分人的喜爱的。除此之外，我也是第一次见识到风力发电机的噪音污染，好似幽幽蝉鸣，一时不觉着什么，但久居其中肯定会受到影响。

和同伴一起出游，似乎更能reflect我自己的大脑。最大的一点感受就是，学econ大大影响了我的思维方式和做决策的逻辑。俩学econ的mbti和九型人格竟然都一样（虽然这俩量表都是你认为自己是什么样的人）。前两天和cohort朋友聊天，我才意识到，我早已习以为常的思维方式，却让很多人觉着太过于冷酷而功利，尤其是在relationship中。从intensive margin上比较marginal cost和benefit，extensive margin上比较各个choice的value，再到我会经常下意识的提醒自己要更理性并维持emotional stability，通过big five对labor market的影响来指导我的行为。好像大学之前，我还是一个情绪不稳定的，过于理想主义和利他主义的f人。不过anyhow，我认为这样的转变是好的！能感受到，但也能理性的判断，总归是一件快乐的事情，人能活得更直顺不扭曲。作为一个2d:4d大于1很多的人，太容易多愁善感，放纵自己的情绪是非常值得警惕的。当然，比较完整的nt人似乎都有点恋爱苦难，不过这也不是坏事，要慢慢找到一种平衡。

最后逛了逛平潭的菜市场，各种五颜六色银光闪闪的小鱼小虾大螃蟹，好不热闹！我想我们一行四人是有点默契的：我也喜欢逛博物馆和当地菜市场；我买的车票早些，就先去了车站，在没有商量的情况下，竟然在不同地方吃了同一品牌的闽南猪脚饭🤣好！流水账就到此结束！"><a href="journals/fujian.html"><div class="card-image"><img src="assets/fujian/02.webp" alt="福州&amp;平潭流水账的照片" loading="lazy" decoding="async"></div><h2>福州&amp;平潭流水账</h2></a></article><article class="card" data-search="济州岛流水账 济州岛 · 牛岛 jeju 韩国，除了其优秀的计量经济学家（细数我上过的4门计量课，一门课老师是韩国人，一门课ta是韩国人，此小样本无从代表什么，但可以代表我的刻板印象hhh），实在是难以令人喜爱。

但特别好的是，在同行友友的带领下，去了很多我自己玩不会去的地方，试了很多新鲜东西！好梦幻的水族馆，美味的炖带鱼，以及消费主义初探哈哈哈！当然，最感谢阿张的摄影 :3看照片的时候，再体味，感觉真是美妙的景色！

玻璃海是极美的，浅水的海岸延伸出去，蓝绿相映间，和黑紫的火山岩礁石交相辉映，比南法的蔚蓝海岸要温柔得多！但被牛岛公交车司机怀疑，实在是令人扫兴！我们买了车票之后先去吃了饭，打算做末班车环岛一圈看看，结果司机连笔划带说几个中文字地怀疑我们已经做过一圈还想再上车：但我们车票都还没剪！当然，也是因为我不懂韩语的问题，语言不通，对啥都有极大影响，语言壁垒对labor market的影响已经有很多了，对tourism 旅游location的选择不知道有没有人写过了。济州岛说大不大，说小不小，从一个地方到另一个地方，通勤时间和北京类似：一小时起步！租车自驾，那将是极好的，可惜我和同行的友友都是拿了驾照但不太会开的类型，于是我俩面对的则是高昂的uber打车费哈哈哈哈哈哈！

免税店和遍地的olive young令人陷入容貌焦虑和消费主义，好在没有美国信用卡！劳动力在行业间的性别差异极大：四天里去吃的所有店都是女店员，而且年龄普遍比较大；uber打的车司机都是男性；而年轻人则更多的在免税店和oy里见到。济州岛说中文比英文好用，感觉岛上的人无论年龄，英语都不太会说。免税店里中国人店员及其多，这种海外务工形式也是很有趣的。我本来想接着问那位店员从哪里来，是不是有老乡也在这工作，可惜店里人来了一个打着微信视频激情选购商品的女子，店员立刻抛下我去热情介绍产品了。韩国店员和中国店员有着气质上的显著差异，总感觉韩国女性过于温柔了，以至于眼神里总有些焦虑和慌张，而男性则相反，总喜欢用鼻孔看人的感觉！

好了，流水账点到为止，太想工作了！就要回到我可爱的香港了！！"><a href="journals/jeju.html"><div class="card-image"><img src="assets/jeju/01.webp" alt="济州岛流水账的照片" loading="lazy" decoding="async"></div><h2>济州岛流水账</h2></a></article><article class="card" data-search="越南流水账 河内 · 沙坝 · 下龙湾 vietnam 从河内入境越南，先给我来了个下马威：中国人申请了所谓的evisa之后，下了飞机还要去另一个counter换纸质签证。整个counter基本上都是中国人，还有几个办落地签的澳大利亚人。我先把护照和evisa给一个男工作人员，然后这个人收了几本护照之后再转移到另一个女工作人员处去核对信息，打印签证，盖章。暂且不说已经申请了evisa还要换一个打印的visa这件事情的匪夷所思，这个counter有三四个人，但实际上在干活的只有那个女工作人员，而男工作人员这步让整个环节更混乱了，完全没有先后顺序：不过这提供了寻租空间，我看到期间有会越南语的人拿着现金去贿赂男女工作人员，然后非常迅速地直接拿到了签证。不知道何时才能拿到那张纸令我焦虑地等待，我在等了半小时之后上前问女工作人员还要大概多久，她头也没抬，指着旁边男工作人员，意思大概是让我去问他，我去问，男工作人员非常不耐烦的大声说：i don’t know! 平安夜的小彭，可怜地在机场等着是否能入关。回想一年前，此时此刻正在发达美丽的广州city walk。在等了一个小时之后我终于拿到了那张纸：和evisa上一模一样的内容，只是换了个纸，多了个章。随后，又是长达三十分钟的排队入关。

在沙坝进行了两天的小徒步，从县城出发，穿过了六个山村。黝黑的归家的孩子，佝偻的妇女，斜倒的路灯，颠簸泥泞的道路，非常原始的耕种技术（水牛加人力），虽然只是用眼睛看，无从知晓其中的细节（譬如这些孩子在学校都在学习什么，课程设置是否合理，教学节奏是否科学，但我估计大概率没有非常严格的教学标准）。沙坝距离云南只要20km，有机会要去云南那边看看，那边是什么样的发展程度。沙坝县也是非常落后的感觉，但因为游客众多（有很多好奇的白人），所以服务业人员多少都会一些英语。这也是有趣的，为什么只有沙坝县有很多这种trekking的团？我想有几个原因，一个是因为附近的更大的城市lao cai有铁路通过（越南唯一的一条铁路，法国殖民时期的遗产，速度比坐大巴还慢）,沙坝县是附近最近的一个县，所以交通上相比较而言比较方便，另一个可能的原因我猜可能是历史上机缘巧合，一些聪明的村民发现有一些好奇的游客在附近晃悠，或者去到其他地方，发现了类似的商业模式，于是在sapa也如法炮制。泥泞的山路，及其狭窄的梯田小路，我很难保持平衡，一只鞋直接踏进泥潭牺牲了（好在是防水的登山鞋！）但当地人却能灵活自如地穿梭其中。还很有趣的一件事是当我们开始徒步的时候，有两个妇女开始跟着我们，我们一开始很警觉，觉着她们可能要偷东西或者卖东西，后来发现她们跟了我们一路，还没有要离开的意思，我们就放松了警惕，以为这也是团里固定的一部分，接受了她们的“善意”，比如溯溪的时候帮忙扶一下，比如路上给我们编花篮。结果——走到了晚上住的村，这两个妇女开始向我们兜售东西，价格按照当地物价来看也不便宜，一个所谓的手工小钱包要30港币左右，这在当地可以吃两顿非常丰盛的饭了，感觉这种商业模式太过于奇怪！同行的白人更是感觉匪夷所思：they follow us the whole trip and just for that?不过也是很独特的经历了。

首都河内给人一种中国内地小县城在2010年附近的感觉，嘈杂的摩托车混杂着汽车和人流，各种元素奇怪的混杂在一起：old quater 的quasi 法式建筑，但刷上了亚热带的亮黄色 ，文庙里的中文，升龙皇城里歪歪扭扭的中文……

如果法国一直在殖民越南，会怎么样？如果越南战争里南部赢了北方，会怎么样？合成控制法或许可以告诉你一些aggregate level的picture，但它的assumption在现实里不一定成立，也无法让我们真的看到更具体的图像。但我们能做的，不是说如果过去如何如何，而是说对于现在的越南，我们看到了很多对游客而言tedious又inefficient的方面，what are the source of cause for these? what can we do to that might help the country and the ppl? 这都是我想了解的。不过如果真的把我派去越南的村庄里去协调世界银行的项目之类的，之前我觉着很酷，但现在觉着这无疑是一个非常难的工作，这需要一个人不仅仅会一些越南语，而且要在一个充满了各种官僚的各种人之间协调，而且要和村里人打交道…非常佩服！

越南食物是极好的：鸡肉河粉，清澈见底的汤，但非常鲜美；鲜虾纸皮卷配上清新酸甜辣的蘸料，清香鲜甜可口；徒步完的晚上，吃上一些油炸越南春卷和炸鱼，简单的蔬菜和熏猪肉，也是非常满足。越南的自然风光是极为独特的：在游艇上惬意的欣赏了一天的雅丹地貌，走进不小的融洞看奇异的钟乳石（ps越南的这种石洞没有奇怪的灯光，就是正常的白灯），本来可以上另一个岛游览一番，但越南的独特性又展现了：岛上的官员禁止所有游船上岛，具体原因不得而知，说是海洋状况不佳，但这么多游艇都出海了，此时海上也没有什么风浪，我应该在那会查一下windy看看海洋情况的。

玩了四天，现在太想工作了！"><a href="journals/vietnam.html"><div class="card-image"><img src="assets/vietnam/03.webp" alt="越南流水账的照片" loading="lazy" decoding="async"></div><h2>越南流水账</h2></a></article></div><p class="empty" hidden>没有找到匹配的游记。</p></section></main><footer class="wrap">中子流水账</footer></body></html>
